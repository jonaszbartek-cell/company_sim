# Editable game content — Buildings
# Add a building by appending under `buildings:`.
# Production methods reference buildings by `building_id`.
#
# Costs (placeholders):
#   build_cost: cash paid on construct (default 100)
#   build_cost_items: inventory goods consumed (default 10x construction_materials)
#
# Plot rules:
#   Mine → specialized_mine only (method locked at build)
#   Rig  → specialized_well only (method locked at build; oil/gas/water via method)
#   All other factories → standard + both specialized types

buildings:
  - id: mine
    name: Mine
    description: Extracts ores and minerals (no recipe inputs)
    build_cost: 100
    build_cost_items:
      construction_materials: 10
    locks_production_method: true
    allowed_plot_types:
      - specialized_mine

  - id: rig
    name: Rig
    description: Extracts oil, natural gas, and water (no recipe inputs)
    build_cost: 100
    build_cost_items:
      construction_materials: 10
    locks_production_method: true
    allowed_plot_types:
      - specialized_well

  - id: foundry
    name: Foundry
    description: Smelts ores into metals
    build_cost: 100
