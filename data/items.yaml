# Editable game content — Items (goods)
# Add a new item by appending under `items:` with a unique `id`.
# Inventories, recipes, and the goods index reference items by `id`.
# Categories are free-form tags for filtering / LLM context.

items:
  # --- Raw extracts (Mine / Rig) ---
  - id: iron_ore
    name: Iron Ore
    category: raw
    description: Mined ore; Foundry input for steel

  - id: copper_ore
    name: Copper Ore
    category: raw
    description: Mined ore; Foundry input for copper

  - id: bauxite
    name: Bauxite
    category: raw
    description: Mined ore; Foundry input for aluminum

  - id: coal
    name: Coal
    category: raw
    description: Mined fuel; Foundry and Power Plant input

  - id: limestone
    name: Limestone
    category: raw
    description: Mined rock; Manufacturing input for cement

  - id: silica
    name: Silica
    category: raw
    description: Mined mineral; glass and electronics input

  - id: rare_minerals
    name: Rare Minerals
    category: raw
    description: Scarce mined minerals for advanced recipes

  - id: oil
    name: Oil
    category: raw
    description: Extracted by Rig; Refinery and Chemical Plant input

  - id: natural_gas
    name: Natural Gas
    category: raw
    description: Extracted by Rig; chemicals and power input

  - id: water
    name: Water
    category: raw
    description: Extracted by Rig; Chemical Plant input

