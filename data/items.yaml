# Editable game content — Items
# Add a new item by appending under `items:` with a unique `id`.
# Inventories and recipes reference items by `id`.

items:
  - id: iron
    name: Iron
    category: raw
    description: Raw iron for smelting

  - id: coal
    name: Coal
    category: raw
    description: Fuel for industrial processes

  - id: energy
    name: Energy
    category: utility
    description: Power consumed by industrial buildings

  - id: steel
    name: Steel
    category: processed
    description: Processed metal produced in a foundry
