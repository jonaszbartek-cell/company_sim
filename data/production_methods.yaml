# Editable game content — Production methods (recipes)
# Add a method under `production_methods:`.
# `inputs` / `outputs` keys must match item ids from items.yaml.
# `building_id` must match a building in buildings.yaml.
#
# Placeholders for now:
#   - all input/output quantities are 1
#   - duration_sec = 1  →  one basic time unit (= one day; day advances when all companies acted)

production_methods:
  # --- Mine (no inputs) ---
  - id: extract_iron_ore
    name: Iron Ore
    description: Mine iron ore
    building_id: mine
    duration_sec: 1
    inputs: {}
    outputs:
      iron_ore: 1

  - id: extract_copper_ore
    name: Copper Ore
    description: Mine copper ore
    building_id: mine
    duration_sec: 1
    inputs: {}
