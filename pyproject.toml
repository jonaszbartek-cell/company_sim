[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-sim"
version = "0.1.0"
description = "Real-time company economic simulator with local LLM rivals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "websockets>=13.0",
]

[project.scripts]
company-sim = "company_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
