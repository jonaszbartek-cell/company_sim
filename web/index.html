<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>company_sim</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">company_sim</div>
      <div id="hud-time" class="hud">day 1</div>
      <div id="hud-cash" class="hud">cash=—</div>
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-pass" type="button">Pass day</button>
    </header>
    <main>
      <canvas id="map" width="960" height="720"></canvas>
      <aside>
        <h2>Selected</h2>
        <pre id="selected">Click a plot</pre>
        <div class="row">
          <button id="btn-buy" type="button" disabled>Buy plot</button>
          <button id="btn-build" type="button" disabled>Build foundry</button>
        </div>
        <div class="row">
          <button id="btn-produce" type="button" disabled>Produce</button>
          <button id="btn-road" type="button" disabled>Build road</button>
          <button id="btn-merge" type="button" disabled>Merge with last</button>
        </div>
        <h2>Inventory</h2>
        <pre id="inventory">—</pre>
        <h2>Market</h2>
        <pre id="market">—</pre>
        <div class="row">
          <button id="btn-mkt-buy-iron" type="button">Buy 1 iron</button>
          <button id="btn-mkt-sell-steel" type="button">Sell 1 steel @40</button>
        </div>
        <h2>Mail</h2>
        <select id="mail-to"></select>
        <textarea id="mail-body" rows="2" placeholder="Message…"></textarea>
        <button id="btn-mail-send" type="button">Send</button>
        <pre id="mail-log">—</pre>
        <h2>AI</h2>
        <pre id="ai-log">—</pre>
        <pre id="ai-mode" class="hint">mode: —</pre>
        <p class="hint">
          1 city + 2 AI companies + you. One day when all companies act.
          Soft tint = city territory. Gold-brown = municipal plots.
        </p>
      </aside>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
